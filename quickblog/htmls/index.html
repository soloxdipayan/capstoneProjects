<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="./public/styles/style.css">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <title>Home - Blog</title>
 <script src="./index.js"></script>
</head>
<body>
 <!-- Header -->
 <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
 <span class="fs-4">Blog Website</span>
 </header>

 <!-- Image Section -->
 <section class="container my-4">
 <div class="row justify-content-center">
 <div class="col-lg-8 col-md-10 col-sm-12 text-center">
 <img src="./public/images/blog-banner.jpg" alt="Blog Banner" class="img-fluid rounded shadow">
 </div>
 </div>
 </section>

 <!-- Blog Read Section -->
 <section class="container my-4">
 <div class="row justify-content-center">
 <div class="col-lg-8 col-md-10 col-sm-12 text-center">
     <h2>Latest Blog Post</h2>
     <p>Blog</p>
     <!-- Updated buttons with postId -->
     <button onclick="redirectToEdit(1)" class="btn btn-primary mt-2">Edit & Update</button>
     <button onclick="redirectToDelete(1)" class="btn btn-danger mt-2">Delete</button>
     <button onclick="redirectToNewPost()" class="btn btn-success mt-2">New Post</button>
 </div>
 </div>
 </section>

    <!-- Footer -->
    <footer class="text-center py-3 border-top">© 2024 Blog Website</footer>
</body>
</html>
